name: mapfollow
description: Guidage vocal et suivi local de parcours de trail.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  flutter_tts: ^4.2.5
  file_picker: ^13.1.0
  xml: ^7.1.0
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/demo.gpx
